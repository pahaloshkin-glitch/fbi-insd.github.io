<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Инспекционный отдел FBI — США, Штат Space</title>
<meta name="description" content="Инспекционный отдел FBI (Federal Bureau of Investigation) в штате Space: внутренний контроль, скрытое наблюдение, дисциплина и порядок. Форма обратной связи INS-302.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%2304060c' stroke='%236f9ae8' stroke-width='4'/%3E%3Cpath d='M30 50 Q50 36 70 50 Q50 64 30 50 Z' fill='none' stroke='%236f9ae8' stroke-width='3'/%3E%3Ccircle cx='50' cy='50' r='7' fill='%236f9ae8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Exo+2:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ==================== ДИЗАЙН-ТОКЕНЫ (тёмное досье: чёрный, серый, тёмно-синий FBI) ==================== */
:root{
  color-scheme:dark;
  --night:#04060c;   /* почти чёрный — база */
  --slate:#0b0f16;   /* тёмно-серые секции */
  --navy:#0a1224;    /* тёмно-синие секции (FBI) */
  --card:#101a30;    /* карточки */
  --card2:#0d1526;   /* карточки на сером */
  --line:#22304d;    /* линии и рамки */
  --text:#c8d3e4;    /* основной текст (светло-серый) */
  --muted:#8a99b2;   /* приглушённый серый */
  --dim:#5c6b85;     /* служебные подписи */
  --blue:#4a7ad6;    /* синий FBI */
  --blue2:#6f9ae8;   /* синий светлее */
  --blue-deep:#1d3a75;
  --stamp:#c23a2e;   /* красный штампа */
  --ok:#3fae6a;      /* зелёный доступа */
  --light:#e8edf6;
  --disp:'Russo One','Bahnschrift SemiCondensed','Roboto Condensed','Segoe UI',sans-serif;
  --body:'Bahnschrift','Exo 2','Segoe UI',sans-serif;
  --mono:'JetBrains Mono','Consolas','Courier New',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none !important}
html{scroll-behavior:smooth}
body{background:var(--night);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased}
::selection{background:var(--blue);color:var(--light)}
:focus-visible{outline:2px solid var(--blue2);outline-offset:2px}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}

/* ---------- полоса прогресса прокрутки ---------- */
#progress{position:fixed;top:0;left:0;height:2px;width:0;z-index:100;
  background:linear-gradient(90deg,var(--blue),var(--blue2));box-shadow:0 0 8px rgba(111,154,232,.6)}

/* ---------- плавное исчезание контента у краёв экрана ---------- */
.edge-fade{position:fixed;left:0;right:0;height:120px;pointer-events:none;z-index:45;opacity:0}
.edge-fade.top{top:0;background:linear-gradient(to bottom,rgba(4,6,12,.98),rgba(4,6,12,.6) 55%,transparent)}
.edge-fade.bottom{bottom:0;background:linear-gradient(to top,rgba(4,6,12,.98),rgba(4,6,12,.6) 55%,transparent)}

/* ---------- утилиты ---------- */
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.section-pad{padding:80px 0}
@media(min-width:1024px){.section-pad{padding:112px 0}}

/* ---------- контурный дисплейный текст ---------- */
.outline{color:transparent;-webkit-text-stroke:1.8px var(--blue2)}
@media(max-width:640px){.outline{-webkit-text-stroke-width:1.2px}}

/* ---------- лист дела с дыроколом ---------- */
.sheet{position:relative}
.sheet::before{content:"";position:absolute;left:14px;top:0;bottom:0;width:8px;
  background-image:radial-gradient(circle 3.5px at 4px 50%,rgba(200,211,228,.14) 0 62%,transparent 64%);
  background-size:8px 64px;background-repeat:repeat-y;pointer-events:none}

/* ---------- полоска скотча ---------- */
.tape{position:absolute;width:130px;height:26px;top:-13px;background:rgba(111,154,232,.14);
  border-left:1px dashed rgba(200,211,228,.3);border-right:1px dashed rgba(200,211,228,.3)}

/* ---------- резиновый штамп ---------- */
.stamp{font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--stamp);
  border:2.5px solid currentColor;border-radius:5px;padding:.35em .6em;font-weight:700;
  line-height:1.2;text-align:center;box-shadow:inset 0 0 0 1.5px rgba(194,58,46,.3);
  display:inline-block;user-select:none}
.stamp .big{font-size:.72rem;display:block}
.stamp .small{font-size:.6rem;opacity:.8;display:block}
.stamp-anim{animation:stamp .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes stamp{0%{opacity:0;transform:scale(2.1) rotate(-2deg)}
  55%{opacity:1;transform:scale(.94) rotate(-9deg)}100%{opacity:1;transform:scale(1) rotate(-8deg)}}
@media(hover:hover){.stamp:hover{animation:wiggle .4s ease}}
@keyframes wiggle{25%{transform:rotate(-12deg)}50%{transform:rotate(9deg)}75%{transform:rotate(-5deg)}}
.stamp-ok{color:var(--ok);box-shadow:inset 0 0 0 1.5px rgba(63,174,106,.3)}

/* ---------- полосы ретуши ---------- */
.redact{display:inline-block;height:.95em;vertical-align:middle;background:var(--muted);border-radius:2px}

/* ---------- точечная сетка ---------- */
.grid-dots{background-image:radial-gradient(rgba(111,154,232,.12) 1px,transparent 1.5px);background-size:22px 22px}
.grid-dots.animated{animation:gridpan 40s linear infinite}
@keyframes gridpan{to{background-position:44px 44px}}

/* ---------- линованная бумага ---------- */
.ruled{background-image:repeating-linear-gradient(to bottom,transparent 0 27px,rgba(200,211,228,.05) 27px 28px)}

/* ---------- зерно плёнки ---------- */
.noise::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.06;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>")}

/* ---------- появление при скролле ---------- */
.reveal{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
.reveal.is-in{opacity:1;transform:none}

/* ==================== ШАПКА ==================== */
header.site{position:sticky;top:0;z-index:50;border-bottom:1px solid var(--line);
  background:rgba(4,6,12,.9);backdrop-filter:blur(8px)}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;height:64px}
.brand{display:flex;align-items:center;gap:12px}
.brand .seal{width:36px;height:36px;flex:none}
.brand-name{line-height:1.15}
.brand-name b{display:block;font-family:var(--disp);font-weight:400;font-size:14px;
  letter-spacing:.18em;color:var(--light)}
.brand-name span{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.24em;color:var(--muted)}
nav.main{display:none;gap:24px}
@media(min-width:1024px){nav.main{display:flex}}
nav.main a{position:relative;font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--muted);transition:color .2s}
nav.main a::after{content:"";position:absolute;left:0;bottom:-6px;width:100%;height:1px;
  background:var(--blue2);transform:scaleX(0);transform-origin:left;transition:transform .25s}
nav.main a:hover{color:var(--blue2)}
nav.main a:hover::after{transform:scaleX(1)}
.header-right{display:flex;align-items:center;gap:10px}
.status{display:none;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;
  letter-spacing:.18em;color:var(--muted)}
@media(min-width:640px){.status{display:flex}}
.status i{width:8px;height:8px;border-radius:50%;background:var(--blue2);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
.btn{position:relative;overflow:hidden;display:inline-block;background:var(--blue);color:var(--light);
  padding:9px 16px;font-family:var(--disp);font-weight:400;font-size:11px;letter-spacing:.16em;
  box-shadow:0 4px 0 rgba(0,0,0,.55);border:0;cursor:pointer;text-transform:uppercase;
  transition:transform .2s,box-shadow .2s,background .2s,border-color .2s,color .2s}
.btn::after{content:"";position:absolute;top:0;left:-130%;width:60%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);
  transform:skewX(-20deg);transition:left .55s}
.btn:hover{background:var(--blue2);transform:translateY(-2px);box-shadow:0 6px 0 rgba(0,0,0,.55)}
.btn:hover::after{left:140%}
.btn:active{transform:translateY(1px);box-shadow:0 2px 0 rgba(0,0,0,.55)}
.btn.big{padding:16px 32px;font-size:13px;letter-spacing:.2em}
.btn.ghost{border:1px solid var(--line);background:none;color:var(--text);box-shadow:none}
.btn.ghost:hover{border-color:var(--blue2);color:var(--blue2);background:none;box-shadow:none}
.agent-btn{display:inline-flex;align-items:center;gap:8px}
.agent-btn svg{width:15px;height:15px;flex:none}
.agent-btn .t{display:none}
@media(min-width:560px){.agent-btn .t{display:inline}}
.glow{animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 24px rgba(74,122,214,.6),0 6px 0 rgba(0,0,0,.55)}}

/* ==================== HERO ==================== */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero-bg{position:absolute;inset:0;background:url('img/hero-bg2.jpg') center/cover no-repeat;
  opacity:.26;filter:grayscale(1) contrast(1.06);will-change:transform;transform:scale(1.15)}
.hero-shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(4,6,12,.78) 0%,rgba(4,6,12,.6) 45%,var(--night) 100%)}
.scanline{position:absolute;left:0;right:0;height:130px;pointer-events:none;
  background:linear-gradient(to bottom,transparent,rgba(111,154,232,.08),transparent);
  animation:scan 7s linear infinite}
@keyframes scan{from{top:-15%}to{top:115%}}
.particles{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.particles span{position:absolute;bottom:-14px;background:rgba(111,154,232,.5);border-radius:50%;
  box-shadow:0 0 6px rgba(111,154,232,.7);animation:rise linear infinite;opacity:0}
@keyframes rise{0%{opacity:0;transform:translateY(0) translateX(0)}8%{opacity:.85}
  100%{opacity:0;transform:translateY(-108vh) translateX(24px)}}
.hero-grid{position:relative;display:grid;gap:56px;padding:64px 0 80px}
@media(min-width:1024px){.hero-grid{grid-template-columns:1.15fr .85fr;align-items:center;padding:96px 0 112px}}
.dossier-tag{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-bottom:20px;
  font-family:var(--mono);font-size:11px;letter-spacing:.28em;color:var(--blue2)}
.dossier-tag .stamp{font-size:9px;transform:rotate(-6deg)}
.caret{display:inline-block;width:9px;height:1.05em;margin-left:4px;background:var(--blue2);
  vertical-align:-2px;animation:blink 1s steps(2,start) infinite}
@keyframes blink{50%{opacity:0}}
h1.title{font-family:var(--disp);font-weight:400;line-height:1.02;letter-spacing:.02em;color:var(--light)}
h1.title span{display:block;font-size:clamp(32px,6vw,62px)}
h1.title .outline{animation:flicker 5s infinite}
@keyframes flicker{0%,100%{opacity:1}91%{opacity:1}92%{opacity:.35}93%{opacity:1}95%{opacity:.6}96%{opacity:1}}
.hero-lede{margin-top:24px;max-width:560px;font-size:18px;line-height:1.6;color:var(--muted)}
.hero-lede b{color:var(--light);font-weight:400}
.hero-actions{margin-top:32px;display:flex;flex-wrap:wrap;gap:16px}
.meta-grid{margin-top:48px;display:grid;grid-template-columns:1fr 1fr;gap:1px;
  background:rgba(74,122,214,.2);border:1px solid rgba(74,122,214,.35)}
@media(min-width:1024px){.meta-grid{grid-template-columns:repeat(4,1fr)}}
.meta-cell{background:rgba(4,6,12,.9);padding:16px;transition:background .25s}
.meta-cell:hover{background:rgba(74,122,214,.1)}
.meta-cell dt{font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:var(--dim)}
.meta-cell dd{margin-top:6px;font-family:var(--disp);font-weight:400;font-size:14px;
  letter-spacing:.05em;color:var(--light)}
.hero-seal{display:none}
@media(min-width:1024px){.hero-seal{display:block;position:relative;text-align:center}}
.folder-tab{position:absolute;top:8px;left:32px;width:256px;height:32px;transform:rotate(2deg);
  background:var(--light);box-shadow:0 2px 6px rgba(0,0,0,.5)}
.folder-tab span{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.3em;color:var(--night)}
.hero-seal .seal{width:320px;max-width:100%;margin:24px auto 0;animation:float 6s ease-in-out infinite;
  filter:drop-shadow(0 0 22px rgba(74,122,214,.35))}
@keyframes float{50%{transform:translateY(-8px)}}
.ping{position:absolute;top:50%;left:50%;width:150px;height:150px;margin:-75px 0 0 -75px;
  border:1px solid rgba(111,154,232,.45);border-radius:50%;animation:ping 3.2s ease-out infinite;pointer-events:none}
.ping:nth-of-type(2){animation-delay:1.6s}
@keyframes ping{0%{transform:scale(.35);opacity:.9}100%{transform:scale(2.4);opacity:0}}
.hero-stamp{margin-top:8px;animation:stamp .5s cubic-bezier(.2,1.5,.4,1) both .9s,
  stampfloat 4s ease-in-out 1.8s infinite}
@keyframes stampfloat{50%{transform:translateY(-6px) rotate(-8deg)}}

/* ==================== БЕГУЩАЯ ЛЕНТА ==================== */
.ticker{overflow:hidden;background:var(--blue-deep);border-top:1px solid rgba(111,154,232,.35);
  border-bottom:1px solid rgba(111,154,232,.35)}
.ticker-track{display:flex;width:max-content;padding:12px 0;animation:marquee 38s linear infinite}
.ticker:hover .ticker-track{animation-play-state:paused}
.ticker-track span{display:inline-flex;align-items:center;gap:28px;margin:0 28px;
  font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.3em;color:var(--light);white-space:nowrap}
.ticker-track span::after{content:"✦";color:rgba(111,154,232,.7)}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ==================== СЕКЦИИ ==================== */
.sec-head{max-width:760px}
.eyebrow{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:11px;
  letter-spacing:.28em;color:var(--blue2)}
.eyebrow i{display:inline-block;width:10px;height:10px;background:var(--blue2);
  box-shadow:0 0 8px rgba(111,154,232,.8);flex:none}
.sec-title{margin-top:16px;font-family:var(--disp);font-weight:400;font-size:clamp(21px,3.4vw,35px);
  line-height:1.12;letter-spacing:.02em;color:var(--text)}
.sec-lede{margin-top:16px;font-size:17px;line-height:1.6;color:var(--muted)}
.prose{font-size:16px;line-height:1.7;color:#b7c3d6}
.prose p + p{margin-top:16px}
.prose b{color:var(--text)}

/* ---------- фотографии в рамках ---------- */
.photo-frame{position:relative}
.photo-frame .ph{position:relative;overflow:hidden;border:1px solid var(--line);
  padding:10px;background:var(--card);box-shadow:4px 4px 0 rgba(0,0,0,.45)}
.photo-frame .ph::after{content:"";position:absolute;left:0;right:0;top:-40%;height:30%;pointer-events:none;
  background:linear-gradient(to bottom,transparent,rgba(111,154,232,.18),transparent);opacity:0}
.photo-frame:hover .ph::after{opacity:1;animation:phscan 1.6s ease-in-out infinite}
@keyframes phscan{from{top:-40%}to{top:120%}}
.photo-frame img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.05);
  transition:transform .6s ease,filter .6s ease}
.photo-frame:hover img{transform:scale(1.05)}
.photo-frame figcaption{margin-top:10px;font-family:var(--mono);font-size:10px;
  letter-spacing:.18em;color:var(--dim);text-align:center}
.photo-frame .num{display:inline-block;margin-right:8px;padding:2px 6px;border:1px solid var(--blue2);
  color:var(--blue2);font-weight:700}
.photo-stamp{position:absolute;top:-12px;right:18px;z-index:2;transform:rotate(-7deg);
  box-shadow:0 1px 3px rgba(0,0,0,.35)}

/* ---------- сводка (About) ---------- */
.about-grid{display:grid;gap:40px;margin-top:48px}
@media(min-width:1024px){.about-grid{grid-template-columns:1.2fr .8fr}}
.about-side{display:flex;flex-direction:column;gap:32px}
.facts-card{position:relative;background:var(--card);border:1px solid var(--line);
  padding:24px;box-shadow:4px 4px 0 rgba(0,0,0,.45);overflow:hidden;
  transition:transform .25s,box-shadow .25s,border-color .25s}
.facts-card:hover{transform:translateY(-3px);border-color:rgba(74,122,214,.55);
  box-shadow:6px 6px 0 rgba(0,0,0,.5)}
.facts-card::after{content:"";position:absolute;top:0;left:-130%;width:60%;height:100%;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.05),transparent);
  transform:skewX(-20deg);transition:left .65s}
.facts-card:hover::after{left:150%}
.facts-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.facts-head h3{font-family:var(--mono);font-size:10px;letter-spacing:.24em;color:var(--dim);font-weight:400}
.facts-head .stamp{transform:rotate(-6deg);flex:none}
.facts-row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  padding:12px 0;border-bottom:1px solid rgba(200,211,228,.08);transition:background .2s}
.facts-row:hover{background:rgba(74,122,214,.08)}
.facts-row:last-child{border-bottom:none}
.facts-row dt{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--dim)}
.facts-row dd{text-align:right;font-family:var(--disp);font-weight:400;font-size:14px;
  letter-spacing:.04em;color:var(--text)}

/* ---------- организации (Division) ---------- */
.org-intro{margin-top:48px;max-width:780px;font-size:16px;line-height:1.7;color:#b7c3d6}
.ministry{margin-top:44px}
.ministry-head{display:flex;align-items:center;gap:14px;border-left:3px solid var(--blue);
  padding-left:14px}
.ministry-head h3{position:relative;font-family:var(--disp);font-weight:400;font-size:17px;
  letter-spacing:.03em;color:var(--light)}
.ministry-head h3::after{content:"";position:absolute;left:0;bottom:-7px;width:100%;height:2px;
  background:var(--blue2);transform:scaleX(0);transform-origin:left;transition:transform .35s}
.ministry-head:hover h3::after{transform:scaleX(1)}
.ministry-head .cnt{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.18em;
  color:var(--dim);white-space:nowrap}
.org-grid{margin-top:16px;display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(235px,1fr))}
.org-card{position:relative;background:var(--card);border:1px solid var(--line);overflow:hidden;
  padding:20px;transition:transform .25s,box-shadow .25s,border-color .25s}
.org-card:hover{transform:translateY(-4px) scale(1.02);border-color:rgba(74,122,214,.65);
  box-shadow:0 8px 26px rgba(74,122,214,.18)}
.org-card::after{content:"";position:absolute;top:0;left:-130%;width:60%;height:100%;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.05),transparent);
  transform:skewX(-20deg);transition:left .65s}
.org-card:hover::after{left:150%}
.org-card .tag{position:absolute;top:12px;right:12px;font-family:var(--mono);font-size:9px;
  letter-spacing:.2em;color:var(--stamp)}
.org-card .code{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--blue2)}
.org-card h3{margin-top:8px;font-family:var(--disp);font-weight:400;font-size:15px;
  letter-spacing:.02em;color:var(--light)}
.org-card p{margin-top:8px;font-size:14px;line-height:1.6;color:var(--muted)}

/* ---------- задачи (Duties) ---------- */
.protocols{margin-top:48px;display:grid;gap:20px}
@media(min-width:768px){.protocols{grid-template-columns:1fr 1fr}}
.protocol{position:relative;background:var(--card);border:1px solid var(--line);
  padding:24px 24px 20px;transition:transform .25s,border-color .25s}
.protocol:hover{transform:translateY(-3px);border-color:rgba(74,122,214,.65)}
.protocol .num{position:absolute;top:-12px;left:24px;background:var(--night);
  border:1px solid var(--blue2);color:var(--blue2);font-family:var(--mono);font-size:12px;
  font-weight:700;letter-spacing:.2em;padding:2px 10px}
.protocol h3{font-family:var(--disp);font-weight:400;font-size:18px;letter-spacing:.02em;color:var(--light)}
.protocol ul{margin-top:16px;list-style:none}
.protocol li{display:flex;gap:12px;font-size:14px;line-height:1.6;color:var(--muted)}
.protocol li + li{margin-top:10px}
.protocol li::before{content:"—";color:var(--blue2)}
.photo-strip{margin:56px auto 0;display:grid;gap:24px;max-width:960px}
@media(min-width:768px){.photo-strip{grid-template-columns:1fr 1fr}}
.powers{margin-top:56px;display:grid;gap:24px 40px}
@media(min-width:768px){.powers{grid-template-columns:1fr 1fr}}
.power{display:flex;gap:16px;border-left:2px solid rgba(74,122,214,.4);padding-left:16px;
  transition:border-color .25s,padding-left .25s}
.power:hover{border-left-color:var(--blue2);padding-left:20px}
.power .num{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.2em;
  color:var(--blue2);padding-top:2px}
.power h3{font-family:var(--disp);font-weight:400;font-size:15px;letter-spacing:.02em;color:var(--text)}

/* ---------- руководство (Leadership) ---------- */
.sub-head{display:flex;align-items:center;gap:14px;margin-top:56px;border-left:3px solid var(--blue);
  padding-left:14px;font-family:var(--disp);font-weight:400;font-size:19px;letter-spacing:.03em;color:var(--light)}
.sub-head .cnt{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.18em;
  color:var(--dim);white-space:nowrap}
.staff-grid{margin:24px auto 0;display:grid;gap:24px;max-width:960px}
/* заместители: три одинаковые колонки по центру (ширина карточки 304px) */
.staff-grid.deputy-row{grid-template-columns:repeat(3,1fr)}
/* директор и куратор: одиночная карточка того же размера, строго по центру */
.staff-grid.director-row{grid-template-columns:repeat(3,1fr)}
.staff-grid.director-row .staff-card{grid-column:2}
/* руководство InsD: две карточки того же размера, по центру */
.staff-grid.insd-row{max-width:632px;grid-template-columns:repeat(2,1fr)}
@media(max-width:860px){
  .staff-grid.deputy-row,.staff-grid.director-row,.staff-grid.insd-row{grid-template-columns:1fr;max-width:420px}
  .staff-grid.director-row .staff-card{grid-column:auto}
}
.director-row .staff-card{border-color:rgba(74,122,214,.55)}
.director-row .staff-card:hover{border-color:rgba(111,154,232,.8)}
.staff-card{position:relative;background:var(--card);border:1px solid var(--line);overflow:hidden;
  box-shadow:4px 4px 0 rgba(0,0,0,.45);transition:transform .25s,box-shadow .25s,border-color .25s}
.staff-card:hover{transform:translateY(-4px);border-color:rgba(74,122,214,.55);
  box-shadow:7px 7px 0 rgba(0,0,0,.5)}
.staff-card::after{content:"";position:absolute;top:0;left:-130%;width:60%;height:100%;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.05),transparent);
  transform:skewX(-20deg);transition:left .65s;z-index:1}
.staff-card:hover::after{left:150%}
.staff-card.office{border-top:3px solid var(--blue)}
.staff-top{display:flex;align-items:center;justify-content:space-between;gap:8px;white-space:nowrap;
  background:var(--night);padding:10px 12px;font-family:var(--mono);font-size:9px;letter-spacing:.14em}
